#
# Run unit tests.
#
name: Test

on:
  workflow_call:

jobs:
  pytest:
    name: Run Unit Tests
    timeout-minutes: 30
    strategy:
      matrix:
        os:
          - "ubuntu-22.04"
          - "windows-2022"
          - "macos-latest"
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-test-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-test-

    - name: Download prebuilt bernard-ledit wheel
      uses: actions/download-artifact@v5
      continue-on-error: true
      with:
        name: bernard-ledit-wheel-${{ runner.os }}
        path: ./.github/artifacts/bernard-ledit

    - name: Locate bundled PDFium
      shell: bash
      run: |
        lib=$(find .github/artifacts/bernard-ledit \( -name 'libpdfium.*' -o -name 'pdfium.dll' \) -print 2>/dev/null | head -n 1)
        if [ -n "$lib" ]; then
          echo "PDFIUM_PATH=$(python -c 'import os,sys;print(os.path.abspath(sys.argv[1]))' "$lib")" >> "$GITHUB_ENV"
        fi

    - name: Install dependencies
      run: |
        python -m pip install pip
        python -c "from pathlib import Path; import subprocess, sys; wheels = sorted(Path('.github/artifacts/bernard-ledit').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheels[0]) if wheels else 'bernard-ledit/bindings/python/'])"
        pip install -e '.[test]'

    - name: Unit testing with pytest
      run: |
        pytest --cov mindee --cov-fail-under 87

  pytest-lite:
    name: Run Unit Tests (Lite)
    timeout-minutes: 30
    strategy:
      matrix:
        os:
          - "ubuntu-22.04"
          - "windows-2022"
          - "macos-latest"
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-test-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-test-

    - name: Install dependencies
      run: |
        pip install toml
        python scripts/generate_lite_toml.py
        mv -f pyproject-lite.toml pyproject.toml
        pip install -e '.[test]'
      shell: bash
    - name: Unit testing with pytest
      run: |
        pytest
