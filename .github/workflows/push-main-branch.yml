name: Push Main Branch

on:
  push:
    branches:
      - main

jobs:
  build-bernard-ledit:
    uses: ./.github/workflows/_build-bernard-ledit.yml
  betterleaks:
    uses: mindee/client-lib-actions/.github/workflows/betterleaks.yml@main
    secrets: inherit
  static-analysis:
    uses: ./.github/workflows/_static-analysis.yml
    needs: build-bernard-ledit
  test-units:
    uses: ./.github/workflows/_test-units.yml
    needs: [ build-bernard-ledit, betterleaks, static-analysis ]
    secrets: inherit
  tag:
    uses: mindee/client-lib-actions/.github/workflows/tag-version.yml@main
    needs: test-units
  release:
    uses: mindee/client-lib-actions/.github/workflows/create-release.yml@main
    needs: tag
    secrets: inherit
