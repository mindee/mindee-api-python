name: Build bernard-ledit Wheel

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheel:
    name: Build bernard-ledit wheel
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-22.04"
          - "windows-2022"
          - "macos-latest"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Resolve bernard-ledit submodule commit
        id: bernard
        shell: bash
        run: |
          echo "sha=$(git -C bernard-ledit rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          rel="$(tr -d '[:space:]' < bernard-ledit/core/pdfium-release)"
          echo "pdfium_dir=${rel//\//_}" >> "$GITHUB_OUTPUT"

      # Skip the whole Rust/maturin build when the submodule pointer is unchanged.
      - name: Restore cached bernard-ledit build
        id: cache
        uses: actions/cache@v5
        with:
          path: ./.github/artifacts/bernard-ledit
          key: bernard-ledit-v2-${{ runner.os }}-${{ steps.bernard.outputs.sha }}

      - name: Cache downloaded PDFium binary
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: bernard-ledit/core/.pdfium_cache
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ steps.bernard.outputs.pdfium_dir }}

      - name: Cache Rust build
        if: steps.cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bernard-ledit
          key: ${{ steps.bernard.outputs.sha }}

      - name: Build bernard-ledit wheel
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip wheel --no-deps --wheel-dir ./.github/artifacts/bernard-ledit bernard-ledit/bindings/python/

      # The wheel does not embed PDFium; ship the library so consumers can set PDFIUM_PATH.
      - name: Collect bundled PDFium library
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          base="bernard-ledit/core/.pdfium_cache/${{ steps.bernard.outputs.pdfium_dir }}"
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)   lib="$base/linux-x64/lib/libpdfium.so" ;;
            Linux-ARM64) lib="$base/linux-arm64/lib/libpdfium.so" ;;
            macOS-ARM64) lib="$base/mac-arm64/lib/libpdfium.dylib" ;;
            macOS-X64)   lib="$base/mac-x64/lib/libpdfium.dylib" ;;
            Windows-X64) lib="$base/win-x64/bin/pdfium.dll" ;;
            *) echo "::error::unsupported runner ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          if [ ! -f "$lib" ]; then
            echo "::error::Expected PDFium library not found: $lib"
            exit 1
          fi
          cp "$lib" ./.github/artifacts/bernard-ledit/
          echo "Bundled PDFium library: $lib"

      - name: Upload bernard-ledit build
        uses: actions/upload-artifact@v4
        with:
          name: bernard-ledit-wheel-${{ runner.os }}
          path: |
            ./.github/artifacts/bernard-ledit/*.whl
            ./.github/artifacts/bernard-ledit/libpdfium.*
            ./.github/artifacts/bernard-ledit/pdfium.dll
          if-no-files-found: error
