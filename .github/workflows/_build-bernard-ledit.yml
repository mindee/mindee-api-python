name: Build bernard-ledit Wheel

on:
  workflow_call:
    inputs:
      include_macos:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      include_macos:
        required: false
        type: boolean
        default: false

jobs:
  build-wheel:
    name: Build bernard-ledit wheel
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: "ubuntu-22.04"
            requires_macos: false
          - os: "windows-2022"
            requires_macos: false
          - os: "macos-latest"
            requires_macos: true
    if: ${{ !matrix.requires_macos || inputs.include_macos }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Build bernard-ledit wheel
        run: |
          python -m pip install --upgrade pip
          pip wheel --no-deps --wheel-dir ./.github/artifacts/bernard-ledit bernard-ledit/bindings/python/

      - name: Upload bernard-ledit wheel
        uses: actions/upload-artifact@v4
        with:
          name: bernard-ledit-wheel-${{ runner.os }}
          path: ./.github/artifacts/bernard-ledit/*.whl
          if-no-files-found: error
