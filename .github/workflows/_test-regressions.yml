#
# Run regression tests.
#
name: Regression Test

on:
  workflow_call:
  workflow_dispatch:

jobs:
  pytest:
    name: Run Regression Tests
    timeout-minutes: 30
    strategy:
      matrix:
        os:
          - "ubuntu-22.04"
          - "windows-2022"
        python-version:
          - "3.10"
          - "3.14"
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-test-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-test-

    - name: Download prebuilt bernard-ledit wheel
      uses: actions/download-artifact@v5
      continue-on-error: true
      with:
        name: bernard-ledit-wheel-${{ runner.os }}
        path: ./.github/artifacts/bernard-ledit

    - name: Install dependencies
      run: |
        python -m pip install pip
        python -c "from pathlib import Path; import subprocess, sys; wheels = sorted(Path('.github/artifacts/bernard-ledit').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheels[0]) if wheels else 'bernard-ledit/bindings/python/'])"
        pip install -e '.[test]'
    - name: Run Regression Testing
      env:
          MINDEE_API_KEY: ${{ secrets.MINDEE_API_KEY_SE_TESTS }}
      run: |
        pytest --cov mindee -m regression

    - name: Notify Slack Action on Failure
      uses: ravsamhq/notify-slack-action@2.5.0
      if: ${{ always() && github.ref_name == 'main' }}
      with:
        status: ${{ job.status }}
        notify_when: "failure"
        notification_title: "Regression test workflow '{workflow}' is failing"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.PRODUCTION_ISSUES_SLACK_HOOK_URL }}
