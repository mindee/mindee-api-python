name: Smoke Test

on:
  workflow_call:
  workflow_dispatch:

env:
  MINDEE_API_KEY: ${{ secrets.MINDEE_API_KEY_SE_TESTS }}
  MINDEE_V2_API_KEY: ${{ secrets.MINDEE_V2_SE_TESTS_API_KEY }}
  MINDEE_V2_SE_TESTS_FINDOC_MODEL_ID: ${{ secrets.MINDEE_V2_SE_TESTS_FINDOC_MODEL_ID }}
  MINDEE_V2_SE_TESTS_CLASSIFICATION_MODEL_ID: ${{ secrets.MINDEE_V2_SE_TESTS_CLASSIFICATION_MODEL_ID }}
  MINDEE_V2_SE_TESTS_CROP_MODEL_ID: ${{ secrets.MINDEE_V2_SE_TESTS_CROP_MODEL_ID }}
  MINDEE_V2_SE_TESTS_SPLIT_MODEL_ID: ${{ secrets.MINDEE_V2_SE_TESTS_SPLIT_MODEL_ID }}
  MINDEE_V2_SE_TESTS_OCR_MODEL_ID: ${{ secrets.MINDEE_V2_SE_TESTS_OCR_MODEL_ID }}

jobs:
  test:
    name: Run Code Samples
    timeout-minutes: 30
    strategy:
      max-parallel: 2
      matrix:
        python-version:
          - "3.10"
          - "3.14"
    runs-on: "ubuntu-22.04"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-samples-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-samples-

      - name: Download prebuilt bernard-ledit wheel
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: bernard-ledit-wheel-${{ runner.os }}
          path: ./.github/artifacts/bernard-ledit

      - name: Locate bundled PDFium
        shell: bash
        run: |
          lib=$(find .github/artifacts/bernard-ledit \( -name 'libpdfium.*' -o -name 'pdfium.dll' \) -print 2>/dev/null | head -n 1)
          if [ -n "$lib" ]; then
            echo "PDFIUM_PATH=$(python -c 'import os,sys;print(os.path.abspath(sys.argv[1]))' "$lib")" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: |
          python -m pip install pip
          python -c "from pathlib import Path; import subprocess, sys; wheels = sorted(Path('.github/artifacts/bernard-ledit').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheels[0]) if wheels else 'bernard-ledit/bindings/python/'])"
          pip install -e '.'

      - name: Tests v2 sample code
        run: |
          ./tests/test_v2_code_samples.sh

      - name: Tests v1 sample code
        run: |
          ./tests/test_v1_code_samples.sh ${{ secrets.MINDEE_ACCOUNT_SE_TESTS }} ${{ secrets.MINDEE_ENDPOINT_SE_TESTS }}

      - name: Notify Slack Action on Failure
        uses: ravsamhq/notify-slack-action@2.5.0
        if: ${{ always() && github.ref_name == 'main' }}
        with:
          status: ${{ job.status }}
          notify_when: "failure"
          notification_title: "Code sample test '{workflow}' is failing"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.PRODUCTION_ISSUES_SLACK_HOOK_URL }}
