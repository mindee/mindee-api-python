#
# Run static code analysis.
#
name: Static Analysis

on:
  workflow_call:

jobs:
  static-check:
    name: Run Static Analysis
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        # Betterleaks scans git history across refs, so it needs the full
        # history rather than the default shallow clone.
        fetch-depth: 0

    - name: Run Betterleaks (git)
      id: betterleaks-git
      continue-on-error: true
      # version 0.1.0
      uses: dortort/betterleaks-action@cd0b905aa4befb8f42f8b1ab98150180c9e77515
      with:
        version: "v1.9.0"
        scan-mode: git
        report-path: betterleaks-git-report.sarif
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Run Betterleaks (dir)
      id: betterleaks-dir
      continue-on-error: true
      # version 0.1.0
      uses: dortort/betterleaks-action@cd0b905aa4befb8f42f8b1ab98150180c9e77515
      with:
        version: "v1.9.0"
        scan-mode: dir
        report-path: betterleaks-dir-report.sarif
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Betterleaks report
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: betterleaks-report
        if-no-files-found: warn
        path: |
          ${{ steps.betterleaks-git.outputs.report-path }}
          ${{ steps.betterleaks-dir.outputs.report-path }}

    - name: Fail if Betterleaks found leaks
      if: steps.betterleaks-git.outcome == 'failure' || steps.betterleaks-dir.outcome == 'failure'
      run: |
        echo "Betterleaks reported a failure in at least one scan."
        exit 1

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-lint-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-lint-

    - name: Install dependencies
      run: |
        python -m pip install pip
        pip install -e '.[lint]'

    - name: License check
      run: |
        pylic check --allow-extra-safe-licenses

    - name: Cache pre-commit
      uses: actions/cache@v6
      with:
        path: ~/.cache/prek
        key: ${{ runner.os }}-prec-${{ hashFiles('prek.toml') }}
        restore-keys: |
          ${{ runner.os }}-prec-

    - name: Run all static analysis
      env:
        SKIP: betterleaks,sphinx-html,sphinx-linkcheck
      run: |
        prek run --all-files
