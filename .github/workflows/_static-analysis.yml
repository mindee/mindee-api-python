#
# Run static code analysis.
#
name: Static Analysis

on:
  workflow_call:

jobs:
  static-check:
    name: Run Static Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-lint-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-lint-

    - name: Download prebuilt bernard-ledit wheel
      uses: actions/download-artifact@v5
      continue-on-error: true
      with:
        name: bernard-ledit-wheel-${{ runner.os }}
        path: ./.github/artifacts/bernard-ledit

    - name: Install dependencies
      run: |
        python -m pip install pip
        pip install pylic~=3.6.1
        python -c "from pathlib import Path; import subprocess, sys; wheels = sorted(Path('.github/artifacts/bernard-ledit').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheels[0]) if wheels else 'bernard-ledit/bindings/python/'])"
        pip install -e '.'

    - name: License check
      run: |
        pylic check --allow-extra-safe-licenses

    - name: Install lint dependencies
      run: |
        pip install -e '.[lint]'

    - name: Audit dependencies
      run: |
        pip-audit --local --skip-editable

    - name: Cache pre-commit
      uses: actions/cache@v6
      with:
        path: ~/.cache/pre-commit
        key: ${{ runner.os }}-prec-${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: |
          ${{ runner.os }}-prec-

    - name: Run all static analysis
      env:
        SKIP: sphinx-html,sphinx-linkcheck
      run: |
        pre-commit run --all-files
