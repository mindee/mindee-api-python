#
# Run static code analysis.
#
name: Static Analysis

on:
  workflow_call:

jobs:
  static-check:
    name: Run Static Analysis
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Run Betterleaks
      id: betterleaks
      continue-on-error: true
      # version 0.1.0
      uses: dortort/betterleaks-action@cd0b905aa4befb8f42f8b1ab98150180c9e77515
      with:
        version: "v1.9.0"
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Betterleaks report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: betterleaks-report
        path: betterleaks-report.sarif
        if-no-files-found: warn

    - name: Fail if Betterleaks found leaks
      if: steps.betterleaks.outcome == 'failure'
      run: exit 1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-lint-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-lint-

    - name: Download prebuilt bernard-ledit wheel
      uses: actions/download-artifact@v5
      with:
        name: bernard-ledit-wheel-${{ runner.os }}
        path: ./.github/artifacts/bernard-ledit

    - uses: ./bernard-ledit/.github/actions/setup-libheif

    - name: Install dependencies
      run: |
        python -m pip install pip
        python -c "from pathlib import Path; import subprocess, sys; wheels = list(Path('.github/artifacts/bernard-ledit').glob('*.whl')); assert len(wheels) == 1, 'Expected one Bernard wheel'; subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheels[0])])"
        pip install -e '.[lint]'

    - name: License check
      run: |
        pylic check --allow-extra-safe-licenses

    - name: Audit dependencies
      run: |
        pip-audit --local --skip-editable

    - name: Cache pre-commit
      uses: actions/cache@v6
      with:
        path: ~/.cache/prek
        key: ${{ runner.os }}-prec-${{ hashFiles('prek.toml') }}
        restore-keys: |
          ${{ runner.os }}-prec-

    - name: Run all static analysis
      env:
        SKIP: sphinx-html,sphinx-linkcheck
      run: |
        prek run --all-files
