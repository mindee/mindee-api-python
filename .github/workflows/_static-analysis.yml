#
# Run static code analysis.
#
name: Static Analysis

on:
  workflow_call:

jobs:
  static-check:
    name: Run Static Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Run Betterleaks
      uses: dortort/betterleaks-action@v0.1.0
      with:
        version: "v1.9.0"
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-lint-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-lint-

    - name: Install dependencies
      run: |
        python -m pip install pip
        pip install pylic~=3.6.1
        pip install -e '.[lint]'

    - name: License check
      run: |
        pylic check --allow-extra-safe-licenses

    - name: Cache pre-commit
      uses: actions/cache@v6
      with:
        path: ~/.cache/prek
        key: ${{ runner.os }}-prec-${{ hashFiles('prek.toml') }}
        restore-keys: |
          ${{ runner.os }}-prec-

    - name: Run all static analysis
      env:
        SKIP: sphinx-html,sphinx-linkcheck
      run: |
        prek run --all-files
