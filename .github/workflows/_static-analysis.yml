#
# Run static code analysis.
#
name: Static Analysis

on:
  workflow_call:

jobs:
  static-check:
    name: Run Static Analysis
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-lint-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-lint-

    - name: Install dependencies
      run: |
        python -m pip install pip
        pip install -e '.[lint]'

    - name: License check
      run: |
        pylic check --allow-extra-safe-licenses

    - name: Cache pre-commit
      uses: actions/cache@v6
      with:
        path: ~/.cache/prek
        key: ${{ runner.os }}-prec-${{ hashFiles('prek.toml') }}
        restore-keys: |
          ${{ runner.os }}-prec-

    - name: Run all static analysis
      env:
        # betterleaks is run in a separate workflow
        SKIP: betterleaks,sphinx-html,sphinx-linkcheck
      run: |
        prek run --all-files
