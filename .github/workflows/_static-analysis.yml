#
# Run static code analysis.
#
name: Static Analysis

on:
  workflow_call:

jobs:
  static-check:
    name: Run Static Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Run Betterleaks
      id: betterleaks
      continue-on-error: true
      # version 0.1.0
      uses: dortort/betterleaks-action@cd0b905aa4befb8f42f8b1ab98150180c9e77515
      with:
        version: "v1.9.0"
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Betterleaks report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: betterleaks-report
        path: betterleaks-report.sarif
        if-no-files-found: warn

    - name: Fail if Betterleaks found leaks
      if: steps.betterleaks.outcome == 'failure'
      run: exit 1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-lint-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-lint-

    - name: Install dependencies
      run: |
        python -m pip install pip
        pip install -e '.[lint]'

    - name: License check
      run: |
        pylic check --allow-extra-safe-licenses

    - name: Cache pre-commit
      uses: actions/cache@v6
      with:
        path: ~/.cache/prek
        key: ${{ runner.os }}-prec-${{ hashFiles('prek.toml') }}
        restore-keys: |
          ${{ runner.os }}-prec-

    - name: Run all static analysis
      env:
        SKIP: sphinx-html,sphinx-linkcheck
      run: |
        prek run --all-files
